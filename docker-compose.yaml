services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/nginx/panel.conf:/etc/nginx/panel.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
      - ./hosts:/var/www
      - ./hosts:/etc/nginx/hosts
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - php84
      - php82
      - php80
    networks:
      app-network:
        # алиасы *.dvl.to генерируются scripts/sync-hosts.sh
        # в docker-compose.aliases.yaml (для вебхуков между хостами)

  nodejs:
    build:
      context: ./config/nodejs
      dockerfile: Dockerfile
    working_dir: /var/www
    volumes:
      - ./hosts:/var/www
    ports:
      - "5173:5173"
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: ["tail", "-f", "/dev/null"]
    networks:
      app-network:
        aliases:
          - nodejs
          - vite

  php84:
    build:
      context: ./config/php8.4
      dockerfile: Dockerfile
    volumes:
      - ./hosts:/var/www
      - ./logs/php8.4:/var/log/php
    environment:
      - PHP_VERSION=8.4
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
    ports:
      - "9082:9000"
    networks:
      app-network:
        aliases:
          - php84
          - php-fpm84

  php82:
    build:
      context: ./config/php8.2
      dockerfile: Dockerfile
    volumes:
      - ./hosts:/var/www
      - ./logs/php8.2:/var/log/php
    environment:
      - PHP_VERSION=8.2
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
    ports:
      - "9081:9000"
    networks:
      app-network:
        aliases:
          - php82
          - php-fpm82

  php80:
    build:
      context: ./config/php8.0
      dockerfile: Dockerfile
    volumes:
      - ./hosts:/var/www
      - ./logs/php8.0:/var/log/php
    environment:
      - PHP_VERSION=8.0
      - XDEBUG_MODE=${XDEBUG_MODE:-off}
    ports:
      - "9080:9000"
    networks:
      app-network:
        aliases:
          - php80
          - php-fpm80

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./config/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    networks:
      app-network:
        aliases:
          - mysql
          - db

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
    networks:
      app-network:
        aliases:
          - postgres
          - pg

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data
    networks:
      app-network:
        aliases:
          - redis

  manticore:
    image: manticoresearch/manticore:7.4.6
    volumes:
      - ./data/manticore:/var/lib/manticore/
    ports:
      - "9306:9306"
      - "9308:9308"
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
      memlock:
        soft: -1
        hard: -1
    depends_on:
      - mysql
    networks:
      app-network:
        aliases:
          - manticore

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - ./data/mailpit:/data
    networks:
      app-network:
        aliases:
          - mailpit
          - mailhog   # совместимость со старыми настройками проектов

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      UPLOAD_LIMIT: 512M
      MAX_EXECUTION_TIME: 600
    depends_on:
      - mysql
    networks:
      app-network:
        aliases:
          - phpmyadmin

  adminer:
    image: adminer:latest
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    networks:
      app-network:
        aliases:
          - adminer

networks:
  app-network:
    driver: bridge
