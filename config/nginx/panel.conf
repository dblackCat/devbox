# DevBox Panel — default server (http://localhost и https://localhost)
server {
	listen 80 default_server;
	listen 443 ssl default_server;
	ssl_certificate /etc/nginx/ssl/dvl.to.pem;
	ssl_certificate_key /etc/nginx/ssl/dvl.to.key;
	server_name _;

	location / {
		proxy_pass http://host.containers.internal:8989;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;   # SSE-стримы логов
		proxy_read_timeout 1h; # долгий follow
	}
}
