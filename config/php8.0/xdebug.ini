; Xdebug выключен по умолчанию. Включение:
;   .env: XDEBUG_MODE=debug  (перезапустить стек)
;   или разово: just run php82 env XDEBUG_MODE=debug php script.php
xdebug.mode = off
xdebug.start_with_request = yes
xdebug.client_host = host.containers.internal
xdebug.client_port = 9003
xdebug.idekey = PHPSTORM
